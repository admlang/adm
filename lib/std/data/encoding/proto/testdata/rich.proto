syntax = "proto2";
package rich;
import "google/protobuf/descriptor.proto";
option java_package = "com.example.rich";
option optimize_for = CODE_SIZE;
extend google.protobuf.FieldOptions {
  optional string unit = 50001;
  optional Limits limits = 50002;
}
extend google.protobuf.MessageOptions { repeated int32 tags = 50003; }
message Limits { optional int32 min = 1; optional int32 max = 2; repeated string notes = 3; }
message Thing {
  option (tags) = 1;
  option (tags) = 2;
  option deprecated = true;
  required int32 id = 1 [(unit) = "ms", (limits).min = 1, (limits).max = 9, deprecated = true];
  optional string name = 2 [default = "a\"b\n", json_name = "nm"];
  optional double ratio = 3 [default = -inf, (limits) = { min: 0 notes: ["x", "y"] }];
  optional bytes raw = 4 [default = "\001\xff"];
  optional Color color = 5 [default = BLUE];
  repeated int32 packed = 6 [packed = true];
  optional group Grp = 7 { optional int32 inner = 1; }
  map<string, Thing> kids = 8;
  oneof pick { int32 a = 9; string b = 10; }
  extensions 100 to 199, 300 to max;
  reserved 20 to 25, 30;
  reserved "old", "older";
  enum Color { option allow_alias = true; RED = 0; BLUE = 1; AZURE = 1 [deprecated = true]; reserved 5 to 8; reserved "PINK"; }
  optional int64 hexed = 11 [default = 0x1F];
  optional sint32 neg = 12 [default = -010];
  optional float f = 13 [default = 1e10];
}
extend Thing { optional int32 ext_a = 100; }
service Svc { option deprecated = true; rpc Do(Thing) returns (stream Thing) { option idempotency_level = NO_SIDE_EFFECTS; } }
