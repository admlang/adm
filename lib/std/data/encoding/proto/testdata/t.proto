syntax = "proto3";
package t;
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
enum Colour { RED = 0; GREEN = 1; BLUE = 2; }
message Phone { string number = 1; int32 kind = 2; }
message Person {
  string name = 1; int32 id = 2; repeated string emails = 4;
  bytes blob = 5; bool active = 6; double score = 7; float ratio = 8;
  uint64 big = 9; repeated int32 nums = 11;
  map<string, int32> counts = 13; Phone main = 14;
  google.protobuf.Timestamp at = 15; google.protobuf.Duration wait = 16;
  Colour colour = 17; uint32 small = 18; int32 neg = 20; repeated Phone phones = 21;
  repeated float fs = 22;
}
message Wire {
  sint64 s64 = 1; sint32 s32 = 2; fixed32 f32 = 3; fixed64 f64 = 4; sfixed32 sf32 = 5; sfixed64 sf64 = 6;
  repeated sint32 zs = 7; repeated fixed64 fx = 8; repeated bool bs = 9; repeated double ds = 10; repeated uint64 us = 11;
}
