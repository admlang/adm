type Query {
  books: [TestBook!]!
  """The books of a genre, at most limit of them."""
  byGenre(
    genre: TestGenre!
    """how many books at most"""
    limit: Int = 10
  ): [TestBook!]!
  """
  The books a filter takes; the context, when a string, must be
  "reader".
  """
  search(filter: BookFilterInput!): [TestBook!]!
}

"""A book of the library."""
type TestBook {
  """The title on the cover."""
  title: String!
  year: Int!
  genre: TestGenre!
  subtitle: String @deprecated(reason: "Use title.")
  published: DateTime
}

"""What a book is about."""
enum TestGenre {
  """Made up."""
  Fiction
  History
}

"""An instant, as RFC 3339 text."""
scalar DateTime @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc3339")

input BookFilterInput {
  genres: [TestGenre!]!
  minYear: Int
}

type Mutation {
  """Adds a book and returns it."""
  add(title: String!, year: Int!, genre: TestGenre = Fiction): TestBook!
}