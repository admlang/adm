openapi: 3.2.0
$self: https://example.com/pets/openapi.yaml
info:
  title: Pets
  summary: The pets of a shop.
  description: |
    Lists, adds and finds **pets**.

    <script>alert(1)</script>
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.com/v1
    name: production
tags:
  - name: pets
    summary: Pets
  - name: dogs
    parent: pets
security:
  - key: []
paths:
  /pets:
    get:
      tags: [pets]
      summary: List pets
      operationId: listPets
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: tags
          in: query
          schema: {type: array, items: {type: string}}
        - name: ids
          in: query
          explode: false
          schema: {type: array, items: {type: integer}}
        - name: color
          in: query
          style: deepObject
          schema:
            type: object
            properties:
              R: {type: integer}
              G: {type: integer}
        - name: sizes
          in: query
          style: pipeDelimited
          schema: {type: array, items: {type: string, enum: [s, m, l]}}
        - $ref: '#/components/parameters/Trace'
      responses:
        '200':
          description: The pets.
          headers:
            X-Total:
              required: true
              schema: {type: integer}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Pet'}
            application/jsonl:
              itemSchema: {$ref: '#/components/schemas/Pet'}
        4XX:
          $ref: '#/components/responses/Problem'
    post:
      tags: [pets]
      operationId: addPet
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewPet'}
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/NewPet'}
          multipart/form-data:
            schema:
              type: object
              required: [name, photo]
              properties:
                name: {type: string}
                age: {type: integer}
                photo: {contentMediaType: image/png}
          application/xml:
            schema: {$ref: '#/components/schemas/NewPet'}
          image/png:
            schema: {maxLength: 16}
      responses:
        '201':
          description: Added.
  /pets/mine:
    get:
      operationId: myPets
      security: []
      responses:
        '200':
          description: Mine.
  /pets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64}
    get:
      operationId: getPet
      parameters:
        - name: fields
          in: header
          schema: {type: array, items: {type: string}}
        - name: session
          in: cookie
          required: true
          schema: {type: string, pattern: '^[a-f0-9]+$'}
      responses:
        '200':
          description: The pet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pet'}
    delete:
      operationId: deletePet
      security:
        - bearer: []
      responses:
        '204':
          description: Gone.
  /shelves/{shelf}/{coords}:
    get:
      operationId: shelf
      parameters:
        - name: shelf
          in: path
          required: true
          style: label
          schema: {type: array, items: {type: integer}}
        - name: coords
          in: path
          required: true
          style: matrix
          explode: true
          schema:
            type: object
            properties:
              x: {type: integer}
              y: {type: integer}
      responses:
        '200':
          description: The shelf.
  /search:
    query:
      operationId: search
      parameters:
        - name: q
          in: querystring
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                required: [term]
                properties:
                  term: {type: string, minLength: 2}
                  page: {type: integer}
      responses:
        '200':
          description: Results.
webhooks:
  newPet:
    post:
      security: []
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Pet'}
      responses:
        '200':
          description: Received.
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        tag: {type: [string, 'null']}
    NewPet:
      type: object
      required: [name]
      xml: {name: pet}
      properties:
        id: {type: integer, xml: {nodeType: attribute}}
        name: {type: string, minLength: 1}
        age: {type: integer, minimum: 0}
        nicknames:
          type: array
          xml: {nodeType: element, name: aliases}
          items: {type: string, xml: {name: alias}}
  parameters:
    Trace:
      name: X-Trace
      in: header
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: A problem.
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title: {type: string}
  securitySchemes:
    key:
      type: apiKey
      name: X-Key
      in: header
    bearer:
      type: http
      scheme: bearer
